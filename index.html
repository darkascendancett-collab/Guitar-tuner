    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:14%;
    transition:opacity .7s ease;
  }
  #splash::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(8,5,6,.25) 0%, rgba(8,5,6,.55) 60%, rgba(8,5,6,.85) 100%);
  }
  #splash.fade{opacity:0; pointer-events:none;}
  .splash-title{position:relative; z-index:1; font-family:'Rye', serif; font-size:clamp(1.8rem,8vw,2.6rem); color:var(--cream); text-shadow:0 3px 14px rgba(0,0,0,.8); text-align:center; letter-spacing:1px;}
  .splash-by{position:relative; z-index:1; font-family:'Great Vibes', cursive; font-size:clamp(1.1rem,5vw,1.5rem); color:var(--brass); margin-top:4px; text-shadow:0 2px 10px rgba(0,0,0,.7);}
  .splash-brand{position:relative; z-index:1; font-family:'Great Vibes', cursive; font-size:clamp(1.8rem,8vw,2.5rem); color:var(--cream); margin-top:-8px; text-shadow:0 2px 10px rgba(0,0,0,.7);}

  /* ---------------- app shell ---------------- */
  #app{
    display:flex; flex-direction:column;
    height:100%; width:100%; max-width:440px;
    padding:8px 12px 10px;
    opacity:0;
  }
  #app.ready{opacity:1; transition:opacity .35s ease;}

  .app-header{text-align:center; flex:none; margin-bottom:4px;}
  .app-title{font-family:'Rye', serif; font-size:clamp(1.3rem,6vw,1.6rem); color:var(--cream); margin:0; line-height:1.1;}
  .brand-credit{display:flex; flex-direction:column; align-items:center; line-height:1;}
  .brand-credit .by-word{font-family:'Great Vibes', cursive; font-size:0.95rem; color:var(--brass);}
  .brand-credit .brand-name{font-family:'Great Vibes', cursive; font-size:1.35rem; color:var(--cream-dim); margin-top:-3px;}

  [hidden]{display:none !important;}

  /* ---------------- 3D button system ---------------- */
  .btn3d{
    border:none;
    border-radius:9px;
    background:linear-gradient(160deg, #7a5133 0%, #5c3d28 55%, #4a2f22 100%);
    color:var(--cream);
    box-shadow:
      0 3px 0 #1e120c,
      0 5px 8px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.18),
      inset 0 -2px 4px rgba(0,0,0,.22);
    font-family:'Fredoka', system-ui, sans-serif;
    font-weight:600;
    cursor:pointer;
    transition:transform .07s ease, box-shadow .07s ease, background .07s ease;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  .btn3d:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #1e120c, inset 0 3px 5px rgba(0,0,0,.5);
  }
  .btn3d.active{
    background:linear-gradient(160deg, var(--brass) 0%, var(--brass-dim) 100%);
    color:var(--wood-dark);
    transform:translateY(2px);
    box-shadow:
      0 1px 0 #7a5a2a,
      inset 0 2px 5px rgba(0,0,0,.35),
      0 0 9px rgba(216,162,74,.55);
  }

  /* tab bar */
  .tab-bar{display:flex; gap:5px; flex:none; margin:5px 0 6px;}
  .tab-btn{flex:1; padding:7px 1px; font-size:0.66rem; line-height:1.15; border-radius:9px; text-align:center;}

  /* tuning row */
  .tuning-row{display:flex; align-items:center; gap:7px; flex:none; margin-bottom:6px;}
  .tuning-row label{font-size:0.68rem; color:var(--cream-dim); white-space:nowrap; flex:none;}
  #tuningSelect{
    flex:1; min-width:0;
    padding:7px 8px;
    border-radius:8px;
    border:none;
    background:linear-gradient(160deg, #3a2519, #241610);
    color:var(--cream);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.05);
    font-family:'Fredoka', system-ui, sans-serif;
    font-size:0.72rem;
    font-weight:600;
  }

  main{flex:1; min-height:0; display:flex; flex-direction:column;}
  .mode-section{flex:1; min-height:0; display:flex; flex-direction:column; align-items:stretch;}

  /* needle / strobe switch */
  .switch2{
    position:relative; width:132px; height:30px; margin:2px auto 4px;
    border-radius:15px; flex:none;
    background:linear-gradient(180deg,#171717,#333);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.65), inset 0 -1px 0 rgba(255,255,255,.05);
    display:flex; align-items:center; padding:3px;
    cursor:pointer;
  }
  .switch2 .knob{
    position:absolute; top:3px; left:3px; width:63px; height:24px;
    border-radius:12px;
    background:linear-gradient(160deg,#e4e6ea,#9a9ea6);
    box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7);
    transition:left .16s ease;
  }
  .switch2.right .knob{left:66px;}
  .switch2 .lbl{flex:1; text-align:center; font-size:0.62rem; font-weight:700; color:#8a8a8a; z-index:1; font-family:'Fredoka',sans-serif;}
  .switch2 .lbl.on{color:#181410;}

  /* gauge crop (top-half strobe / needle) */
  .gauge-crop{
    position:relative; width:min(210px,50vw); aspect-ratio:2/1;
    margin:2px auto 2px; overflow:hidden; flex:none;
  }
  .strobe{position:absolute; top:0; left:0; width:100%; aspect-ratio:1/1;}
  .strobe::before{
    content:''; position:absolute; inset:-7%; border-radius:50%;
    background:var(--wood-dark);
    box-shadow:0 0 0 3px var(--wood-light), inset 0 0 20px rgba(0,0,0,.45);
  }
  .ring{position:absolute; top:50%; left:50%; border-radius:50%; transform:translate(-50%,-50%) rotate(0deg); will-change:transform;}
  .ring-coarse{width:100%; height:100%;}
  .ring-mid{width:70%; height:70%;}
  .ring-fine{width:42%; height:42%;}
  .gap{position:absolute; top:50%; left:50%; border-radius:50%; background:var(--wood-dark); transform:translate(-50%,-50%);}
  .gap-outer{width:76%; height:76%;}
  .gap-inner{width:48%; height:48%;}
  .hub{position:absolute; top:50%; left:50%; width:13%; height:13%; border-radius:50%; background:var(--brass); box-shadow:0 0 0 3px var(--wood-dark); transform:translate(-50%,-50%);}
  .pointer{
    position:absolute; top:-3%; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:11px solid var(--cream);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));
  }
  .needle-gauge{position:absolute; top:0; left:0; width:100%; height:100%;}

  .note-readout{text-align:center; flex:none; margin-top:0;}
  .note-name{font-family:'Fredoka', system-ui, sans-serif; font-size:2.1rem; font-weight:700; line-height:1; transition:color .15s ease;}
  .cents-value{font-family:'Fredoka', system-ui, sans-serif; font-weight:600; font-size:0.95rem; min-height:1.2rem; transition:color .15s ease;}
  .string-tag{display:block; font-size:0.7rem; color:var(--cream-dim);}
  .status-msg{text-align:center; min-height:1.3em; font-size:0.82rem; font-weight:700; flex:none; margin:2px 0 4px;}

  .start-btn{
    display:block; margin:0 auto 6px; padding:8px 26px; flex:none;
    font-family:'Fredoka', system-ui, sans-serif; font-size:0.95rem; font-weight:600;
    color:var(--wood-dark);
    background:linear-gradient(160deg, var(--brass), var(--brass-dim));
    border:none; border-radius:999px; cursor:pointer;
    box-shadow:0 3px 0 #7a5a2a, 0 5px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .start-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #7a5a2a;}
  .start-btn.listening{
    background:linear-gradient(160deg, var(--wood-light), var(--wood-mid));
    color:var(--cream);
    box-shadow:0 3px 0 #1e120c;
  }

  .lock-row{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; overflow:hidden;}
  .strings, .chromatic-grid{display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:5px;}
  .chromatic-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:5px; max-width:320px; margin:0 auto; width:100%;}
  .string-btn, .note-btn{
    min-width:36px; height:38px; padding:0 6px;
    border-radius:9px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    font-size:0.92rem;
  }
  .string-btn span{font-family:'Nunito Sans', sans-serif; font-size:0.55rem; font-weight:600; opacity:0.75;}
  .note-btn{font-size:0.82rem;}

  /* ---------------- tune by ear ---------------- */
  #earMode{flex:1; min-height:0; display:flex; flex-direction:column;}
  .switch3{
    position:relative; width:min(230px,72vw); height:30px; margin:2px auto 4px; flex:none;
    border-radius:15px;
    background:linear-gradient(180deg,#171717,#333);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.65);
    display:flex; align-items:center; padding:3px;
    cursor:pointer;
  }
  .switch3 .knob{
    position:absolute; top:3px; left:3px; width:calc(33.333% - 4px); height:24px;
    border-radius:12px;
    background:linear-gradient(160deg,#e4e6ea,#9a9ea6);
    box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7);
    transition:left .16s ease;
  }
  .switch3[data-pos="1"] .knob{left:calc(33.333% + 1px);}
  .switch3[data-pos="2"] .knob{left:calc(66.666% - 1px);}
  .switch3 .lbl{flex:1; text-align:center; font-size:0.58rem; font-weight:700; color:#8a8a8a; z-index:1; font-family:'Fredoka',sans-serif;}
  .switch3 .lbl.on{color:#181410;}

  .headstock-wrap{position:relative; flex:1; min-height:0; margin:2px auto; width:auto; height:100%; max-width:100%; aspect-ratio:320/260;}
  .headstock-svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .peg-btn{
    position:absolute; transform:translate(-50%,-50%);
    width:44px; height:48px;
    border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    font-size:0.9rem;
    touch-action:manipulation;
  }
  .peg-btn.compact{width:38px; height:42px; font-size:0.78rem;}
  .peg-btn span{font-family:'Nunito Sans', sans-serif; font-size:0.52rem; font-weight:600; opacity:0.75;}
  .peg-btn.looping{
    background:linear-gradient(160deg, var(--green), #4f8a4c) !important;
    color:var(--wood-dark) !important;
    animation:pegPulse 1s ease-in-out infinite;
  }
  @keyframes pegPulse{
    0%,100%{box-shadow:0 3px 0 #1e120c, 0 0 0 0 rgba(111,176,107,.55);}
    50%{box-shadow:0 3px 0 #1e120c, 0 0 0 9px rgba(111,176,107,0);}
  }
  .ear-hint{text-align:center; font-size:0.66rem; color:var(--cream-dim); flex:none; margin:2px 0 0; line-height:1.3;}

  /* ---------------- metronome ---------------- */
  .metro-display{text-align:center; flex:none;}
  .metro-bpm{font-family:'Fredoka', system-ui, sans-serif; font-weight:700; font-size:2.3rem; line-height:1; color:var(--cream);}
  .metro-bpm-label{font-size:0.62rem; color:var(--cream-dim); letter-spacing:1.5px; text-transform:uppercase;}

  .metro-slider-row input[type=range]{flex:1; max-width:160px; accent-color:var(--brass);}
  .step-btn{width:32px; height:32px; flex:none; border-radius:50%; font-size:1.05rem; display:flex; align-items:center; justify-content:center;}
  .tap-btn{display:block; margin:2px auto 6px; padding:6px 18px; font-size:0.78rem; border-radius:999px; flex:none;}
  .time-sig-row{display:flex; justify-content:center; flex:none;}
  .num-stepper{display:flex; align-items:center; gap:10px;}
  .time-sig-value{font-family:'Fredoka', system-ui, sans-serif; font-weight:700; font-size:1.2rem; min-width:52px; text-align:center;}
  .denom-row{display:flex; gap:5px; justify-content:center; flex:none; margin:4px 0;}
  .denom-row .btn3d, .sound-row .btn3d{padding:5px 10px; font-size:0.68rem;}
  .beat-dots{display:flex; justify-content:center; align-items:center; gap:7px; flex:1; min-height:20px;}
  .beat-dot{width:13px; height:13px; border-radius:50%; background:var(--wood-light); border:2px solid var(--wood-light); transition:transform .05s ease;}
  .beat-dot.downbeat{width:16px; height:16px; background:var(--brass-dim); border-color:var(--brass-dim);}
  .beat-dot.flash{animation:dotFlash .18s ease-out;}
  .beat-dot.downbeat.flash{animation:dotFlashAccent .2s ease-out;}
  @keyframes dotFlash{0%{background:var(--cream); border-color:var(--cream); transform:scale(1.35);} 100%{background:var(--wood-light); border-color:var(--wood-light); transform:scale(1);}}
  @keyframes dotFlashAccent{0%{background:var(--brass); border-color:var(--brass); transform:scale(1.4);} 100%{background:var(--brass-dim); border-color:var(--brass-dim); transform:scale(1);}}
  .sound-row{display:flex; justify-content:center; gap:5px; flex-wrap:wrap; flex:none; margin:4px 0;}
  .metro-foot{text-align:center; font-size:0.6rem; color:var(--cream-dim); flex:none; line-height:1.3;}
</style>
</head>
<body>

<div id="app">

                  fill="#5c4a3a" stroke="#c9a86a" stroke-width="2.5"/>
            <rect x="128" y="62" width="16" height="130" rx="8" fill="#2b1b14" stroke="#c9a86a" stroke-width="2"/>

<script>
// ================= Note / tuning utilities =================
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteFreq(name, octave){
  const idx = NOTE_NAMES.indexOf(name);
  const midi = (octave + 1) * 12 + idx;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function ordinalWord(n){
  if (n === 1) return '1st';
  if (n === 2) return '2nd';
  if (n === 3) return '3rd';
  return n + 'th';
}
function ringDuration(freq){
  const d = 1.4 * Math.pow(110 / freq, 0.35) + 1.1;
  return clamp(d, 1.1, 3.2);
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

const TUNINGS = [
  { name:'Standard',                    strings:6, notes:[['E',2],['A',2],['D',3],['G',3],['B',3],['E',4]] },
  { name:'Drop D',                      strings:6, notes:[['D',2],['A',2],['D',3],['G',3],['B',3],['E',4]] },
  { name:'Drop C#',                     strings:6, notes:[['C#',2],['G#',2],['C#',3],['F#',3],['A#',3],['D#',4]] },
  { name:'Drop C',                      strings:6, notes:[['C',2],['G',2],['C',3],['F',3],['A',3],['D',4]] },
  { name:'Half Step Down',              strings:6, notes:[['D#',2],['G#',2],['C#',3],['F#',3],['A#',3],['D#',4]] },
  { name:'Full Step Down (D Standard)', strings:6, notes:[['D',2],['G',2],['C',3],['F',3],['A',3],['D',4]] },
  { name:'Open D',                      strings:6, notes:[['D',2],['A',2],['D',3],['F#',3],['A',3],['D',4]] },
  { name:'Open G',                      strings:6, notes:[['D',2],['G',2],['D',3],['G',3],['B',3],['D',4]] },
  { name:'Open E',                      strings:6, notes:[['E',2],['B',2],['E',3],['G#',3],['B',3],['E',4]] },
  { name:'Open A',                      strings:6, notes:[['E',2],['A',2],['E',3],['A',3],['C#',4],['E',4]] },
  { name:'Open C',                      strings:6, notes:[['C',2],['G',2],['C',3],['G',3],['C',4],['E',4]] },
  { name:'DADGAD',                      strings:6, notes:[['D',2],['A',2],['D',3],['G',3],['A',3],['D',4]] },
  { name:'7-String Standard',           strings:7, notes:[['B',1],['E',2],['A',2],['D',3],['G',3],['B',3],['E',4]] },
  { name:'7-String Drop A',             strings:7, notes:[['A',1],['E',2],['A',2],['D',3],['G',3],['B',3],['E',4]] },
  { name:'7-String Half Step Down',     strings:7, notes:[['A#',1],['D#',2],['G#',2],['C#',3],['F#',3],['A#',3],['D#',4]] },
  { name:'8-String Standard',           strings:8, notes:[['F#',1],['B',1],['E',2],['A',2],['D',3],['G',3],['B',3],['E',4]] },
  { name:'8-String Drop E',             strings:8, notes:[['E',1],['B',1],['E',2],['A',2],['D',3],['G',3],['B',3],['E',4]] },
];

function buildStringsFromTuning(t){
  return t.notes.map(([name, octave], i) => {
    const freq = noteFreq(name, octave);
    const posFromThin = t.strings - i;
    let label = ordinalWord(posFromThin);
    if (posFromThin === t.strings) label += ' · thickest';
    else if (posFromThin === 1) label += ' · thinnest';
    return { name, octave, freq, label, ring: ringDuration(freq) };
  });
}

let currentTuning = TUNINGS[0];
let STRINGS = buildStringsFromTuning(currentTuning);

// ================= Shared state =================
const PALETTE = {
  woodDark:'#2b1b14', woodLight:'#6b4530', cream:'#f3e9d8',
  green:'#6fb06b', amber:'#d9a441', coral:'#e2664b'
};
const STATE_COLORS = {
  idle:{a:PALETTE.woodDark, b:PALETTE.woodLight},
  good:{a:PALETTE.woodDark, b:PALETTE.green},
  ok:  {a:PALETTE.woodDark, b:PALETTE.amber},
  off: {a:PALETTE.woodDark, b:PALETTE.coral},
};
function stateTextColor(state){
  return state === 'idle' ? PALETTE.cream
    : state === 'good' ? PALETTE.green
    : state === 'ok' ? PALETTE.amber
    : PALETTE.coral;
}

let currentMode = 'guitar';
let displayStyle = 'needle';
let lockedIndex = -1;
let lockedChroma = -1;

let audioCtx, analyser, mic, rafId;
let listening = false;

let smoothedFreq = null;
let smoothedCents = 0;
let lastLabel = null;
let lastSub = null;
let lastGoodTime = -Infinity;
let lastFrameTime = null;
let currentColorState = null;

const ringAngles = { coarse:0, mid:0, fine:0 };

// ================= DOM refs =================
const startBtn = document.getElementById('startBtn');
const noteNameEl = document.getElementById('noteName');
const centsValueEl = document.getElementById('centsValue');
const stringTagEl = document.getElementById('stringTag');
const statusMsg = document.getElementById('statusMsg');
const stringRow = document.getElementById('stringRow');
const stringLockRow = document.getElementById('stringLockRow');
const chromaticLockRow = document.getElementById('chromaticLockRow');
const chromaticGrid = document.getElementById('chromaticGrid');
const ringCoarseEl = document.getElementById('ringCoarse');
const ringMidEl = document.getElementById('ringMid');
const ringFineEl = document.getElementById('ringFine');
const tunerSection = document.getElementById('tunerMode');
const earSection = document.getElementById('earMode');
const metroSection = document.getElementById('metroMode');
const headstockWrap = document.getElementById('headstockWrap');
const pegGraphics = document.getElementById('pegGraphics');
const tuningSelect = document.getElementById('tuningSelect');
const strobeDisplay = document.getElementById('strobeDisplay');
const needleDisplay = document.getElementById('needleDisplay');
const needleLine = document.getElementById('needleLine');
const needleTicks = document.getElementById('needleTicks');
const displaySwitch = document.getElementById('displaySwitch');
const guitarTypeSwitch = document.getElementById('guitarTypeSwitch');
const artNylon = document.getElementById('artNylon');
const artSteel = document.getElementById('artSteel');
const artElectric = document.getElementById('artElectric');

// ================= Tuning dropdown =================
(function populateTunings(){
  const groups = { '6-String':[], '7-String':[], '8-String':[] };
  TUNINGS.forEach(t => {
    const key = t.strings === 6 ? '6-String' : t.strings === 7 ? '7-String' : '8-String';
    groups[key].push(t);
  });
  Object.entries(groups).forEach(([label, arr]) => {
    if (!arr.length) return;
    const og = document.createElement('optgroup');
    og.label = label;
    arr.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.name;
      opt.textContent = t.name + ': ' + t.notes.map(n => n[0]).join(' ');
      og.appendChild(opt);
    });
    tuningSelect.appendChild(og);
  });
})();

tuningSelect.addEventListener('change', () => {
  const t = TUNINGS.find(x => x.name === tuningSelect.value);
  if (!t) return;
  applyTuning(t);
});

function applyTuning(t){
  currentTuning = t;
  STRINGS = buildStringsFromTuning(t);
  lockedIndex = -1;
  stopLoop();
  rebuildStringLockButtons();
  rebuildPegUI();
  resetGaugeState();
}

function resetGaugeState(){
  lastLabel = null;
  lastGoodTime = -Infinity;
  smoothedCents = 0;
  currentColorState = null;
  applyColorState('idle');
}

// ================= String lock row (guitar tab) =================
function rebuildStringLockButtons(){
  stringRow.innerHTML = '';
  const autoBtn = document.createElement('button');
  autoBtn.className = 'string-btn btn3d active';
  autoBtn.dataset.index = '-1';
  autoBtn.textContent = 'Auto';
  stringRow.appendChild(autoBtn);
  STRINGS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'string-btn btn3d';
    btn.dataset.index = i;
    btn.innerHTML = s.name + '<span>' + (STRINGS.length - i) + '</span>';
    stringRow.appendChild(btn);
  });
}
stringRow.addEventListener('click', e => {
  const btn = e.target.closest('.string-btn');
  if (!btn) return;
  lockedIndex = parseInt(btn.dataset.index, 10);
  stringRow.querySelectorAll('.string-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});
rebuildStringLockButtons();

// ================= Chromatic 12-note grid =================
NOTE_NAMES.forEach((n, i) => {
  const btn = document.createElement('button');
  btn.className = 'note-btn btn3d';
  btn.dataset.chroma = i;
  btn.textContent = n;
  chromaticGrid.appendChild(btn);
});
chromaticGrid.addEventListener('click', e => {
  const btn = e.target.closest('.note-btn');
  if (!btn) return;
  const i = parseInt(btn.dataset.chroma, 10);
  if (lockedChroma === i){
    lockedChroma = -1;
    btn.classList.remove('active');
    return;
  }
  chromaticGrid.querySelectorAll('.note-btn').forEach(b => b.classList.remove('active'));
  lockedChroma = i;
  btn.classList.add('active');
});

// ================= Tabs =================
document.querySelectorAll('.tab-bar .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    if (mode === currentMode) return;
    if ((currentMode === 'guitar' || currentMode === 'chromatic') && listening) stopListening();
    if (currentMode === 'ear') stopLoop();
    if (currentMode === 'metro' && isMetroPlaying) stopMetronome();

    currentMode = mode;
    document.querySelectorAll('.tab-bar .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    tunerSection.hidden = !(mode === 'guitar' || mode === 'chromatic');
    earSection.hidden = mode !== 'ear';
    metroSection.hidden = mode !== 'metro';

    if (mode === 'guitar' || mode === 'chromatic'){
      stringLockRow.hidden = mode !== 'guitar';
      chromaticLockRow.hidden = mode !== 'chromatic';
      resetGaugeState();
    }
  });
});

// ================= Needle / strobe switch =================
function setDisplayStyle(style){
  displayStyle = style;
  strobeDisplay.style.display = style === 'strobe' ? '' : 'none';
  needleDisplay.style.display = style === 'needle' ? '' : 'none';
  displaySwitch.classList.toggle('right', style === 'strobe');
  displaySwitch.querySelectorAll('.lbl').forEach((el, i) => {
    el.classList.toggle('on', (i === 0 && style === 'needle') || (i === 1 && style === 'strobe'));
  });
}
displaySwitch.addEventListener('click', () => setDisplayStyle(displayStyle === 'needle' ? 'strobe' : 'needle'));
setDisplayStyle('needle');

function buildConic(segments, a, b){
  const step = 360 / segments;
  const stops = [];
  for (let i = 0; i < segments; i++){
    const s = i * step, e = (i + 1) * step;
    stops.push(`${i % 2 === 0 ? a : b} ${s}deg ${e}deg`);
  }
  return `conic-gradient(${stops.join(',')})`;
}

// needle gauge ticks (built once)
(function buildNeedleTicks(){
  const CX = 150, CY = 148, R = 125;
  const ns = 'http://www.w3.org/2000/svg';
  for (let c = -50; c <= 50; c += 10){
    const angle = (c / 50) * 60 * (Math.PI / 180);
    const inner = R - 12, outer = R - 1;
    const x1 = CX + inner * Math.sin(angle), y1 = CY - inner * Math.cos(angle);
    const x2 = CX + outer * Math.sin(angle), y2 = CY - outer * Math.cos(angle);
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', c === 0 ? 'var(--brass)' : 'var(--cream-dim)');
    line.setAttribute('stroke-width', c === 0 ? '3' : '1.5');
    needleTicks.appendChild(line);
  }
})();

function applyColorState(state){
  if (state === currentColorState) return;
  currentColorState = state;
  const { a, b } = STATE_COLORS[state];
  ringCoarseEl.style.backgroundImage = buildConic(12, a, b);
  ringMidEl.style.backgroundImage = buildConic(24, a, b);
  ringFineEl.style.backgroundImage = buildConic(48, a, b);
  const textColor = stateTextColor(state);
  noteNameEl.style.color = textColor;
  centsValueEl.style.color = textColor;
  needleLine.setAttribute('stroke', textColor);
}
applyColorState('idle');

// ================= Pitch detection =================
function detectPitch(buf, sampleRate, minFreq, maxFreq){
  const n = buf.length;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / n);
  if (rms < 0.01) return null;

  const maxLag = Math.min(n - 2, Math.ceil(sampleRate / minFreq));
  const minLag = Math.max(2, Math.floor(sampleRate / maxFreq));

  const c = new Float64Array(maxLag + 2);
  const lo = Math.max(1, minLag - 1);
  const hi = Math.min(n - 1, maxLag + 1);
  for (let lag = lo; lag <= hi; lag++){
    let sum = 0;
    const lim = n - lag;
    for (let j = 0; j < lim; j++) sum += buf[j] * buf[j + lag];
    c[lag] = sum;
  }

  let bestLag = -1, bestVal = -Infinity;
  for (let lag = minLag; lag <= maxLag; lag++){
    if (c[lag] > bestVal){ bestVal = c[lag]; bestLag = lag; }
  }
  if (bestLag <= 0) return null;

  const cPrev = c[bestLag - 1], cCur = c[bestLag], cNext = c[bestLag + 1];
  let refined = bestLag;
  const denom = (cPrev + cNext - 2 * cCur);
  if (denom) refined = bestLag + 0.5 * (cPrev - cNext) / denom;

  let c0 = 0;
  for (let j = 0; j < n; j++) c0 += buf[j] * buf[j];
  const clarity = bestVal / (c0 || 1);
  if (clarity < 0.45) return null;

  const freq = sampleRate / refined;
  if (!isFinite(freq) || freq <= 0) return null;
  return { freq, clarity };
}

function nearestStringIndex(freq){
  let best = 0, bestDiff = Infinity;
  STRINGS.forEach((s, i) => {
    const diff = Math.abs(1200 * Math.log2(freq / s.freq));
    if (diff < bestDiff){ bestDiff = diff; best = i; }
  });
  return best;
}

function chromaticFromFreq(freq){
  const midi = 69 + 12 * Math.log2(freq / 440);
  const rounded = Math.round(midi);
  const cents = (midi - rounded) * 100;
  const name = NOTE_NAMES[((rounded % 12) + 12) % 12];
  const octave = Math.floor(rounded / 12) - 1;
  return { name, octave, cents };
}

function centsToLockedClass(freq, classIndex){
  const exactMidi = 69 + 12 * Math.log2(freq / 440);
  const roundedAny = Math.round(exactMidi);
  let best = null, bestDiff = Infinity;
  for (let m = roundedAny - 12; m <= roundedAny + 12; m++){
    if (((m % 12) + 12) % 12 === classIndex){
      const diff = Math.abs(exactMidi - m);
      if (diff < bestDiff){ bestDiff = diff; best = m; }
    }
  }
  const cents = (exactMidi - best) * 100;
  const octave = Math.floor(best / 12) - 1;
  return { name: NOTE_NAMES[classIndex], octave, cents };
}

function tick(timestamp){
  if (lastFrameTime == null) lastFrameTime = timestamp;
  const dt = (timestamp - lastFrameTime) / 1000;
  lastFrameTime = timestamp;

  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);

  let range;
  if (currentMode === 'chromatic') range = [55, 1400];
  else {
    const freqs = STRINGS.map(s => s.freq);
    range = [Math.min(...freqs) * 0.75, Math.max(...freqs) * 1.4];
  }
  const result = detectPitch(buf, audioCtx.sampleRate, range[0], range[1]);

  let cents = null;
  if (result){
    smoothedFreq = smoothedFreq == null ? result.freq : smoothedFreq + (result.freq - smoothedFreq) * 0.3;
    if (currentMode === 'guitar'){
      const idx = lockedIndex >= 0 ? lockedIndex : nearestStringIndex(smoothedFreq);
      const target = STRINGS[idx];
      cents = 1200 * Math.log2(smoothedFreq / target.freq);
      lastLabel = target.name + target.octave;
      lastSub = target.label + ' string';
    } else {
      if (lockedChroma >= 0){
        const r = centsToLockedClass(smoothedFreq, lockedChroma);
        cents = r.cents;
        lastLabel = r.name + r.octave;
        lastSub = 'locked note';
      } else {
        const note = chromaticFromFreq(smoothedFreq);
        cents = note.cents;
        lastLabel = note.name + note.octave;
        lastSub = 'nearest note';
      }
    }
    lastGoodTime = timestamp;
  }

  smoothedCents += ((cents == null ? 0 : cents) - smoothedCents) * (cents == null ? 0.06 : 0.25);

  if (displayStyle === 'strobe'){
    const coarseSpeed = clamp(smoothedCents * 3, -400, 400);
    const midSpeed = clamp(smoothedCents * 9, -700, 700);
    const fineSpeed = clamp(smoothedCents * 20, -900, 900);
    ringAngles.coarse = (ringAngles.coarse + coarseSpeed * dt) % 360;
    ringAngles.mid = (ringAngles.mid + midSpeed * dt) % 360;
    ringAngles.fine = (ringAngles.fine + fineSpeed * dt) % 360;
    ringCoarseEl.style.transform = `translate(-50%,-50%) rotate(${ringAngles.coarse}deg)`;
    ringMidEl.style.transform = `translate(-50%,-50%) rotate(${ringAngles.mid}deg)`;
    ringFineEl.style.transform = `translate(-50%,-50%) rotate(${ringAngles.fine}deg)`;
  } else {
    const clamped = clamp(smoothedCents, -50, 50);
    const angleDeg = (clamped / 50) * 60;
    needleLine.setAttribute('transform', `rotate(${angleDeg} 150 148)`);
  }

  const silentFor = timestamp - lastGoodTime;
  if (silentFor > 900 || lastLabel == null){
    noteNameEl.textContent = '–';
    stringTagEl.textContent = currentMode === 'chromatic' ? 'play any note' : 'play a string to begin';
    centsValueEl.textContent = '';
    statusMsg.textContent = '';
    applyColorState('idle');
  } else {
    noteNameEl.textContent = lastLabel;
    stringTagEl.textContent = lastSub;
    const rounded = Math.round(smoothedCents);
    centsValueEl.textContent = (rounded > 0 ? '+' : '') + rounded + '¢';

    const absC = Math.abs(smoothedCents);
    let state;
    if (absC <= 2){ state = 'good'; statusMsg.textContent = 'Perfect! 🎸'; }
    else if (absC <= 10){ state = 'ok'; statusMsg.textContent = smoothedCents < 0 ? 'A touch tighter ↑' : 'A touch looser ↓'; }
    else { state = 'off'; statusMsg.textContent = smoothedCents < 0 ? 'Too low — tighten ↑' : 'Too high — loosen ↓'; }
    applyColorState(state);
  }

  rafId = requestAnimationFrame(tick);
}

async function startListening(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    mic = audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    listening = true;
    lastFrameTime = null;
    startBtn.textContent = 'Stop Tuning';
    startBtn.classList.add('listening');
    statusMsg.textContent = 'Go ahead, play a note';
    rafId = requestAnimationFrame(tick);
  } catch (err){
    statusMsg.textContent = 'Microphone access was blocked.';
  }
}
function stopListening(){
  listening = false;
  if (rafId) cancelAnimationFrame(rafId);
  if (mic) mic.disconnect();
  if (audioCtx) audioCtx.close();
  smoothedFreq = null;
  ringAngles.coarse = ringAngles.mid = ringAngles.fine = 0;
  ringCoarseEl.style.transform = 'translate(-50%,-50%) rotate(0deg)';
  ringMidEl.style.transform = 'translate(-50%,-50%) rotate(0deg)';
  ringFineEl.style.transform = 'translate(-50%,-50%) rotate(0deg)';
  needleLine.setAttribute('transform', 'rotate(0 150 148)');
  startBtn.textContent = 'Start Tuning';
  startBtn.classList.remove('listening');
  resetGaugeState();
}
startBtn.addEventListener('click', () => { if (listening) stopListening(); else startListening(); });

// ================= Tune by ear: headstock + pegs =================
let guitarType = 'nylon';

function generatePegPositions(n){
  const left = Math.ceil(n / 2), right = n - left;
  const topStart = 14, topEnd = 86;
  const pos = [];
  for (let i = 0; i < left; i++){
    const t = left === 1 ? 0.5 : i / (left - 1);
    pos.push({ side:'left', topPct: topStart + t * (topEnd - topStart) });
  }
  for (let i = 0; i < right; i++){
    const t = right === 1 ? 0.5 : i / (right - 1);
    pos.push({ side:'right', topPct: topStart + t * (topEnd - topStart) });
  }
  return pos;
}

const PEG_THEME = {
  nylon:   { accent:'#c9a86a', dim:'#8a6f45', wood:'#2b1b14' },
  steel:   { accent:'#d8a24a', dim:'#a97e3a', wood:'#2b1b14' },
  electric:{ accent:'#c7ccd4', dim:'#8b9099', wood:'#111114' },
};

function rebuildPegUI(){
  const n = STRINGS.length;
  const positions = generatePegPositions(n);
  const theme = PEG_THEME[guitarType];

  headstockWrap.querySelectorAll('.peg-btn').forEach(b => b.remove());
  STRINGS.forEach((s, i) => {
    const p = positions[i];
    const leftPct = p.side === 'left' ? 9.375 : 90.625;
    const btn = document.createElement('button');
    btn.className = 'peg-btn btn3d' + (n > 6 ? ' compact' : '');
    btn.dataset.index = i;
    btn.style.left = leftPct + '%';
    btn.style.top = p.topPct + '%';
    btn.innerHTML = s.name + '<span>' + (n - i) + '</span>';
    headstockWrap.appendChild(btn);
  });

  pegGraphics.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  positions.forEach((p, i) => {
    const svgY = (p.topPct / 100) * 260;
    const pegX = p.side === 'left' ? 104 : 216;
    const btnX = p.side === 'left' ? 30 : 290;
    const nutX = 160 + (i - (n - 1) / 2) * 8;

    const str = document.createElementNS(ns, 'line');
    str.setAttribute('x1', pegX); str.setAttribute('y1', svgY);
    str.setAttribute('x2', nutX); str.setAttribute('y2', 250);
    str.setAttribute('stroke', theme.accent); str.setAttribute('stroke-width', '1'); str.setAttribute('opacity', '0.25');
    pegGraphics.appendChild(str);

    const conn = document.createElementNS(ns, 'line');
    conn.setAttribute('x1', pegX); conn.setAttribute('y1', svgY);
    conn.setAttribute('x2', btnX); conn.setAttribute('y2', svgY);
    conn.setAttribute('stroke', theme.dim); conn.setAttribute('stroke-width', '2'); conn.setAttribute('stroke-dasharray', '3 4');
    pegGraphics.appendChild(conn);

    const circ = document.createElementNS(ns, 'circle');
    circ.setAttribute('cx', pegX); circ.setAttribute('cy', svgY); circ.setAttribute('r', '7');
    circ.setAttribute('fill', theme.wood); circ.setAttribute('stroke', theme.accent); circ.setAttribute('stroke-width', '2');
    pegGraphics.appendChild(circ);
  });
}
rebuildPegUI();

// guitar type 3-way switch
guitarTypeSwitch.addEventListener('click', e => {
  const lbl = e.target.closest('.lbl');
  const types = ['nylon','steel','electric'];
  let idx;
  if (lbl && lbl.dataset.type) idx = types.indexOf(lbl.dataset.type);
  else {
    const rect = guitarTypeSwitch.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    idx = clamp(Math.floor(relX * 3), 0, 2);
  }
  setGuitarType(types[idx]);
});
function setGuitarType(type){
  guitarType = type;
  const types = ['nylon','steel','electric'];
  guitarTypeSwitch.dataset.pos = types.indexOf(type);
  guitarTypeSwitch.querySelectorAll('.lbl').forEach(el => el.classList.toggle('on', el.dataset.type === type));
  artNylon.style.display = type === 'nylon' ? '' : 'none';

  rebuildPegUI();
}
setGuitarType('nylon');

// ================= Tune by ear: synthesized plucked strings =================
let playCtx = null;
function ensurePlaybackContext(){
  if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (playCtx.state === 'suspended') playCtx.resume();
  return playCtx;
}
function clampSample(v){ return Math.max(-1, Math.min(1, v)); }

function fillKarplusStrong(target, freq, sampleRate, decay, amp){
  const N = Math.max(2, Math.round(sampleRate / freq));
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  let idx = 0;
  for (let i = 0; i < target.length; i++){
    const cur = ring[idx];
    const nxt = ring[(idx + 1) % N];
    const avg = decay * 0.5 * (cur + nxt);
    target[i] += cur * amp;
    ring[idx] = avg;
    idx = (idx + 1) % N;
  }
}

function synthPluckBuffer(ctx, freq, duration, type){
  const sr = ctx.sampleRate;
  const total = Math.floor(sr * duration);
  const buffer = ctx.createBuffer(1, total, sr);
  const data = buffer.getChannelData(0);

  let decay, brightRatio, brightAmp, attackAmp, attackDur, drive;
  if (type === 'nylon'){ decay = 0.9975; brightRatio = 1.5; brightAmp = 0.14; attackAmp = 0.15; attackDur = 0.02; drive = 0; }
  else if (type === 'electric'){ decay = 0.998; brightRatio = 1.5; brightAmp = 0.5; attackAmp = 0.3; attackDur = 0.008; drive = 1.7; }
  else { decay = 0.996; brightRatio = 2; brightAmp = 0.35; attackAmp = 0.25; attackDur = 0.012; drive = 0; } // steel

  fillKarplusStrong(data, freq, sr, decay, 1.0);
  const bright = new Float32Array(total);
  fillKarplusStrong(bright, freq * brightRatio, sr, Math.max(0.9, decay - 0.003), brightAmp);
  for (let i = 0; i < total; i++) data[i] = clampSample(data[i] * 0.85 + bright[i]);

  const attackLen = Math.min(total, Math.floor(sr * attackDur));
  for (let i = 0; i < attackLen; i++){
    const env = 1 - i / attackLen;
    data[i] = clampSample(data[i] + (Math.random() * 2 - 1) * attackAmp * env);
  }

  if (drive > 0){
    const norm = Math.tanh(drive);
    for (let i = 0; i < total; i++) data[i] = Math.tanh(data[i] * drive) / norm;
  }

  const tail = Math.min(total, Math.floor(sr * 0.06));
  for (let i = 0; i < tail; i++){
    const t = i / tail;
    data[total - tail + i] *= t;
  }
  return buffer;
}

function playPluck(freq, duration){
  const ctx = ensurePlaybackContext();
  const buffer = synthPluckBuffer(ctx, freq, duration, guitarType);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const gain = ctx.createGain();
  gain.gain.value = 0.9;
  src.connect(gain).connect(ctx.destination);
  src.start();
}

let loopingIndex = -1;
let loopIntervalId = null;
function stopLoop(){
  if (loopIntervalId){ clearInterval(loopIntervalId); loopIntervalId = null; }
  if (loopingIndex >= 0){
    const el = headstockWrap.querySelector(`.peg-btn[data-index="${loopingIndex}"]`);
    if (el) el.classList.remove('looping');
  }
  loopingIndex = -1;
}
function startLoop(index){
  stopLoop();
  loopingIndex = index;
  const s = STRINGS[index];
  const btn = headstockWrap.querySelector(`.peg-btn[data-index="${index}"]`);
  if (btn) btn.classList.add('looping');
  playPluck(s.freq, s.ring);
  loopIntervalId = setInterval(() => playPluck(s.freq, s.ring), s.ring * 1000);
}

let pegPressIndex = -1, pegPressTimer = null, pegFiredHold = false, pegStoppedThisPress = false;
headstockWrap.addEventListener('pointerdown', e => {
  const btn = e.target.closest('.peg-btn');
  if (!btn) return;
  e.preventDefault();
  const i = parseInt(btn.dataset.index, 10);
  pegPressIndex = i;
  if (loopingIndex === i){
    stopLoop();
    pegStoppedThisPress = true;
    return;
  }
  pegStoppedThisPress = false;
  pegFiredHold = false;
  pegPressTimer = setTimeout(() => { pegFiredHold = true; startLoop(i); }, 1000);
});
headstockWrap.addEventListener('pointerup', () => {
  if (pegPressTimer){ clearTimeout(pegPressTimer); pegPressTimer = null; }
  if (pegStoppedThisPress){ pegStoppedThisPress = false; return; }
  if (!pegFiredHold && pegPressIndex >= 0) playPluck(STRINGS[pegPressIndex].freq, STRINGS[pegPressIndex].ring);
});
document.addEventListener('pointerup', () => { if (pegPressTimer){ clearTimeout(pegPressTimer); pegPressTimer = null; } });
headstockWrap.addEventListener('pointercancel', () => { if (pegPressTimer){ clearTimeout(pegPressTimer); pegPressTimer = null; } });

// ================= Metronome =================
let metroBpm = 120, metroNumerator = 4, metroDenominator = 4, metroSoundStyle = 'click';
let isMetroPlaying = false, metroAudioCtx = null, metroNextNoteTime = 0, metroCurrentBeat = 0;
let metroSchedulerId = null, metroVisualRafId = null, metroScheduledBeats = [];
let tapTimes = [], tapResetTimer = null;

const metroBpmValue = document.getElementById('metroBpmValue');
const bpmSlider = document.getElementById('bpmSlider');
const bpmDown = document.getElementById('bpmDown');
const bpmUp = document.getElementById('bpmUp');
const tapTempoBtn = document.getElementById('tapTempoBtn');
const numDown = document.getElementById('numDown');
const numUp = document.getElementById('numUp');
const timeSigValue = document.getElementById('timeSigValue');
const denomRow = document.getElementById('denomRow');
const beatDots = document.getElementById('beatDots');
const metroStartBtn = document.getElementById('metroStartBtn');
const soundRow = document.getElementById('soundRow');

function renderBeatDots(){
  beatDots.innerHTML = '';
  for (let i = 0; i < metroNumerator; i++){
    const d = document.createElement('div');
    d.className = 'beat-dot' + (i === 0 ? ' downbeat' : '');
    beatDots.appendChild(d);
  }
}
renderBeatDots();
function updateTimeSigLabel(){ timeSigValue.textContent = metroNumerator + '/' + metroDenominator; }
updateTimeSigLabel();
function setBpm(v){
  metroBpm = clamp(Math.round(v), 20, 240);
  bpmSlider.value = metroBpm;
  metroBpmValue.textContent = metroBpm;
}
setBpm(120);

bpmSlider.addEventListener('input', () => setBpm(bpmSlider.value));
bpmDown.addEventListener('click', () => setBpm(metroBpm - 1));
bpmUp.addEventListener('click', () => setBpm(metroBpm + 1));
numDown.addEventListener('click', () => { metroNumerator = clamp(metroNumerator - 1, 1, 16); updateTimeSigLabel(); renderBeatDots(); metroCurrentBeat = 0; });
numUp.addEventListener('click', () => { metroNumerator = clamp(metroNumerator + 1, 1, 16); updateTimeSigLabel(); renderBeatDots(); metroCurrentBeat = 0; });
denomRow.querySelectorAll('.btn3d').forEach(btn => {
  btn.addEventListener('click', () => {
    metroDenominator = parseInt(btn.dataset.denom, 10);
    denomRow.querySelectorAll('.btn3d').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateTimeSigLabel();
  });
});
soundRow.querySelectorAll('.btn3d').forEach(btn => {
  btn.addEventListener('click', () => {
    metroSoundStyle = btn.dataset.sound;
    soundRow.querySelectorAll('.btn3d').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
tapTempoBtn.addEventListener('click', () => {
  const now = performance.now();
  tapTimes.push(now);
  if (tapTimes.length > 5) tapTimes.shift();
  if (tapTimes.length >= 2){
    let sum = 0;
    for (let i = 1; i < tapTimes.length; i++) sum += tapTimes[i] - tapTimes[i - 1];
    setBpm(60000 / (sum / (tapTimes.length - 1)));
  }
  clearTimeout(tapResetTimer);
  tapResetTimer = setTimeout(() => { tapTimes = []; }, 2000);
});

function ensureMetroCtx(){
  if (!metroAudioCtx) metroAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (metroAudioCtx.state === 'suspended') metroAudioCtx.resume();
  return metroAudioCtx;
}
function scheduleClick(ctx, time, accented){
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  if (metroSoundStyle === 'click'){
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = accented ? 1500 : 1000;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(accented ? 0.9 : 0.55, time + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
    osc.connect(gain); osc.start(time); osc.stop(time + 0.05);
  } else if (metroSoundStyle === 'beep'){
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = accented ? 1200 : 800;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(accented ? 0.5 : 0.32, time + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.09);
    osc.connect(gain); osc.start(time); osc.stop(time + 0.1);
  } else if (metroSoundStyle === 'wood'){
    const dur = 0.08;
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = accented ? 1400 : 900; bp.Q.value = 6;
    gain.gain.setValueAtTime(accented ? 0.9 : 0.6, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(bp).connect(gain); src.start(time);
  } else {
    const dur = 0.03;
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = accented ? 3500 : 2500;
    gain.gain.setValueAtTime(accented ? 0.8 : 0.5, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(hp).connect(gain); src.start(time);
  }
}
function metroScheduler(){
  while (metroNextNoteTime < metroAudioCtx.currentTime + 0.1){
    const accented = metroCurrentBeat === 0;
    scheduleClick(metroAudioCtx, metroNextNoteTime, accented);
    metroScheduledBeats.push({ beat: metroCurrentBeat, time: metroNextNoteTime });
    metroNextNoteTime += 60.0 / metroBpm;
    metroCurrentBeat = (metroCurrentBeat + 1) % metroNumerator;
  }
}
function metroVisualLoop(){
  if (!isMetroPlaying) return;
  const now = metroAudioCtx.currentTime;
  while (metroScheduledBeats.length && metroScheduledBeats[0].time <= now){
    const b = metroScheduledBeats.shift();
    const dots = beatDots.querySelectorAll('.beat-dot');
    const el = dots[b.beat];
    if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
  metroVisualRafId = requestAnimationFrame(metroVisualLoop);
}
function startMetronome(){
  ensureMetroCtx();
  isMetroPlaying = true;
  metroCurrentBeat = 0;
  metroScheduledBeats = [];
  metroNextNoteTime = metroAudioCtx.currentTime + 0.05;
  metroSchedulerId = setInterval(metroScheduler, 25);
  metroVisualRafId = requestAnimationFrame(metroVisualLoop);
  metroStartBtn.textContent = 'Stop';
  metroStartBtn.classList.add('active');
}
function stopMetronome(){
  isMetroPlaying = false;
  if (metroSchedulerId){ clearInterval(metroSchedulerId); metroSchedulerId = null; }
  if (metroVisualRafId){ cancelAnimationFrame(metroVisualRafId); metroVisualRafId = null; }
  metroScheduledBeats = [];
  metroStartBtn.textContent = 'Start';
  metroStartBtn.classList.remove('active');
  beatDots.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('flash'));
}
metroStartBtn.addEventListener('click', () => { if (isMetroPlaying) stopMetronome(); else startMetronome(); });

  document.getElementById('app').classList.add('ready');
  setTimeout(() => {
    const splash = document.getElementById('splash');
    splash.classList.add('fade');
    setTimeout(() => { splash.hidden = true; }, 750);
  }, 3000);
});

if ('serviceWorker' in navigator) {

  });
